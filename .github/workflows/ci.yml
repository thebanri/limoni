name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  module-hygiene:
    name: Module Hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # A patch-level `go` directive (e.g. `go 1.26.5`) forces every consumer to
      # download that exact toolchain, and pins the module to a release that may
      # not exist yet on their machine. Only `go 1.N` is acceptable.
      - name: Reject patch-level go directive
        run: |
          set -euo pipefail
          for mod in $(git ls-files '*go.mod' 'go.mod'); do
            directive=$(awk '/^go /{print $2; exit}' "$mod")
            if [[ "$directive" =~ ^[0-9]+\.[0-9]+$ ]]; then
              echo "ok   $mod -> go $directive"
            else
              echo "FAIL $mod declares 'go $directive'; use a two-component version such as 'go 1.25'"
              exit 1
            fi
          done

      # The module must build on the oldest Go release it claims to support,
      # otherwise the declared floor is fiction.
      - name: Build on declared minimum Go version
        env:
          GOTOOLCHAIN: local
        run: go build ./...

      - name: go.mod and go.sum are tidy
        run: |
          set -euo pipefail
          cp go.mod go.mod.bak && cp go.sum go.sum.bak
          go mod tidy
          diff -u go.mod.bak go.mod || { echo "go.mod is not tidy; run 'go mod tidy'"; exit 1; }
          diff -u go.sum.bak go.sum || { echo "go.sum is not tidy; run 'go mod tidy'"; exit 1; }

      # Compiled binaries and local tool configuration must never be committed:
      # they bloat clones and have leaked credentials in the past.
      - name: Reject committed binaries and local config
        run: |
          set -euo pipefail
          offenders=$(git ls-files | grep -E '(\.test|\.exe|\.out|\.prof)$|^settings\.json$' || true)
          if [ -n "$offenders" ]; then
            echo "FAIL tracked build artifacts or local config:"
            echo "$offenders"
            exit 1
          fi
          echo "ok   no tracked build artifacts"

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run Tests
        shell: bash
        run: go test ./...

      - name: Run Go Vet
        shell: bash
        run: go vet ./...

      - name: Race Detection
        if: runner.os != 'Windows'
        shell: bash
        run: go test -race . ./component ./core/engine ./core/terminal ./testkit ./widgets ./layout ./core/accessibility ./core/driver ./compat/bubbletea

      - name: Verify Zero-Allocation Hot Paths
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          go test ./core/buffer -run '^$' -bench 'BenchmarkDiff_' -benchmem | tee bench.txt
          go test ./widgets -run '^$' -bench 'BenchmarkBlockDraw|BenchmarkParagraphDraw|BenchmarkTableDraw|BenchmarkTableVisibleRows' -benchmem | tee -a bench.txt
          go test ./benchmarks -run '^$' -bench 'BenchmarkEmptyFrame|BenchmarkMouseHitTest|BenchmarkHundredLayers|BenchmarkTenThousandRowTable' -benchmem | tee -a bench.txt
          awk '
            function budget(name) {
              if (name ~ /^BenchmarkTenThousandRowTable/) return 16
              return 0
            }
            /allocs\/op/ {
              name = $1
              for (i = 1; i <= NF; i++) {
                if ($i == "allocs/op") allocs = $(i-1)
                if ($i == "ns/op") ns = $(i-1)
              }
              max = budget(name)
              if (allocs + 0 > max) {
                printf "FAIL %s: %s allocs/op exceeds budget %d\n", name, allocs, max
                failed = 1
              }
              if (name ~ /^BenchmarkEmptyFrame/ && ns + 0 > 100) {
                printf "FAIL %s: %s ns/op exceeds 100ns empty-frame budget\n", name, ns
                failed = 1
              }
            }
            END { exit failed }
          ' bench.txt

      - name: Build Examples
        shell: bash
        run: |
          mkdir -p bin
          go build -o bin/limoni-cli ./cmd/limoni
          go build -o bin/simple ./examples/simple
          go build -o bin/showcase ./examples/showcase
          go build -o bin/demo ./examples/demo
          go build -o bin/anim ./examples/animation
          go build -o bin/ascii3d ./examples/ascii3d
          go build -o bin/charts ./examples/charts
          go build -o bin/forms ./examples/forms
          go build -o bin/layer_demo ./examples/layer_demo
          go build -o bin/3d_viewer ./examples/3d_viewer
          go build -o bin/paint ./examples/paint
          go build -o bin/toast ./examples/toast
          go build -o bin/todo ./examples/todo
          go build -o bin/treeview ./examples/treeview
          go build -o bin/dashboard ./examples/dashboard
          go build -o bin/table_virtual ./examples/table_virtual
          go build -o bin/ssh_server ./examples/ssh_server
          go build -o bin/custom_widget ./examples/custom_widget
          go build -o bin/composable ./examples/composable
          go build -o bin/counter ./examples/counter
          GOOS=js GOARCH=wasm go build -o bin/limoni.wasm ./examples/wasm
