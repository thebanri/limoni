name: Limoni Benchmarks

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  benchmark:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Prepare benchmark results
        run: mkdir -p benchmark-results

      - name: Run benchmark suite
        run: |
          go test ./benchmarks -run '^$' -bench . -benchmem -count=3 | tee benchmark-results/go-benchmark.txt

      - name: Run Limoni runner
        run: go run ./benchmarks/runners/limoni -output benchmark-results/limoni.json

      - name: Run Bubble Tea runner
        working-directory: benchmarks/runners/bubbletea
        run: |
          go mod download
          go run . -output ../../../benchmark-results/bubbletea.json

      - name: Run Ratatui runner
        working-directory: benchmarks/runners/ratatui
        env:
          RUSTFLAGS: ""
        run: |
          cargo run --release -- ../../../benchmark-results/ratatui.json

      - name: Build comparison dashboard
        run: |
          go run ./benchmarks/runners/dashboard \
            -output benchmark-results/dashboard.html \
            benchmark-results/limoni.json \
            benchmark-results/bubbletea.json \
            benchmark-results/ratatui.json

      - name: Validate runner reports
        run: |
          echo "=== Checking file existence and non-empty size ==="
          test -s benchmark-results/limoni.json || (echo "limoni.json missing or empty" && exit 1)
          test -s benchmark-results/bubbletea.json || (echo "bubbletea.json missing or empty" && exit 1)
          test -s benchmark-results/ratatui.json || (echo "ratatui.json missing or empty" && exit 1)
          test -s benchmark-results/dashboard.html || (echo "dashboard.html missing or empty" && exit 1)

          echo "=== Validating JSON Implementation fields with jq ==="
          jq -e '.implementation == "limoni" or .workload.implementation == "limoni"' benchmark-results/limoni.json || (cat benchmark-results/limoni.json && exit 1)
          jq -e '.implementation == "bubbletea" or .workload.implementation == "bubbletea"' benchmark-results/bubbletea.json || (cat benchmark-results/bubbletea.json && exit 1)
          jq -e '.implementation == "ratatui" or .workload.implementation == "ratatui"' benchmark-results/ratatui.json || (cat benchmark-results/ratatui.json && exit 1)
          jq -e '.valid == true and .environment.os != null and .environment.arch != null' benchmark-results/limoni.json || (cat benchmark-results/limoni.json && exit 1)
          jq -e '.valid == true and .environment.os != null and .environment.arch != null' benchmark-results/bubbletea.json || (cat benchmark-results/bubbletea.json && exit 1)
          jq -e '.valid == true and .environment.os != null and .environment.arch != null' benchmark-results/ratatui.json || (cat benchmark-results/ratatui.json && exit 1)
          echo "=== Validating common workload names and frame samples ==="
          jq -e '[.workloads[].spec.name] | length == 3' benchmark-results/limoni.json || (cat benchmark-results/limoni.json && exit 1)
          jq -e '[.workloads[].spec.name] | length == 3' benchmark-results/bubbletea.json || (cat benchmark-results/bubbletea.json && exit 1)
          jq -e '[.workloads[].spec.name] | length == 3' benchmark-results/ratatui.json || (cat benchmark-results/ratatui.json && exit 1)
          jq -e 'all(.workloads[]; .summary.Frames >= 20)' benchmark-results/limoni.json || (cat benchmark-results/limoni.json && exit 1)
          jq -e 'all(.workloads[]; .summary.Frames >= 20)' benchmark-results/bubbletea.json || (cat benchmark-results/bubbletea.json && exit 1)
          jq -e 'all(.workloads[]; .summary.Frames >= 20)' benchmark-results/ratatui.json || (cat benchmark-results/ratatui.json && exit 1)

      - name: Generate workload schema sample
        run: |
          cat > benchmark-results/README.txt <<'EOF'
          Benchmark artifacts use the workload schema from benchmarks.WorkloadSpec
          and the summary schema from benchmarks.Summary. Compare implementations
          only when dimensions, content, output sink, color mode, build and host
          are equivalent.
          EOF

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v4
        with:
          name: limoni-benchmarks
          path: benchmark-results/
