name: Limoni Benchmarks

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  benchmark:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Prepare benchmark results
        run: mkdir -p benchmark-results

      - name: Run benchmark suite
        run: |
          go test ./benchmarks -run '^$' -bench . -benchmem -count=3 | tee benchmark-results/go-benchmark.txt

      - name: Run Limoni runner
        run: go run ./benchmarks/runners/limoni -output benchmark-results/limoni.json

      - name: Run Bubble Tea runner
        working-directory: benchmarks/runners/bubbletea
        run: |
          go mod download
          go run . -output ../../../benchmark-results/bubbletea.json

      - name: Run Ratatui runner
        working-directory: benchmarks/runners/ratatui
        env:
          RUSTFLAGS: ""
        run: |
          cargo run --release -- ../../../benchmark-results/ratatui.json

      - name: Build comparison dashboard
        run: |
          go run ./benchmarks/runners/dashboard \
            -output benchmark-results/dashboard.html \
            benchmark-results/limoni.json \
            benchmark-results/bubbletea.json \
            benchmark-results/ratatui.json

      - name: Validate runner reports
        run: |
          echo "=== Checking file existence and non-empty size ==="
          test -s benchmark-results/limoni.json || (echo "limoni.json missing or empty" && exit 1)
          test -s benchmark-results/bubbletea.json || (echo "bubbletea.json missing or empty" && exit 1)
          test -s benchmark-results/ratatui.json || (echo "ratatui.json missing or empty" && exit 1)
          test -s benchmark-results/dashboard.html || (echo "dashboard.html missing or empty" && exit 1)

          echo "=== Validating JSON Implementation & Workloads with jq ==="
          jq -e '.implementation == "limoni" and (.workloads | length > 0)' benchmark-results/limoni.json || (cat benchmark-results/limoni.json && exit 1)
          jq -e '.implementation == "bubbletea" and (.workloads | length > 0)' benchmark-results/bubbletea.json || (cat benchmark-results/bubbletea.json && exit 1)
          jq -e '.implementation == "ratatui" and (.workloads | length > 0)' benchmark-results/ratatui.json || (cat benchmark-results/ratatui.json && exit 1)
          jq -e '[.workloads[].spec.name] | length == 12' benchmark-results/limoni.json || (cat benchmark-results/limoni.json && exit 1)
          jq -e '[.workloads[].spec.name] | length == 12' benchmark-results/bubbletea.json || (cat benchmark-results/bubbletea.json && exit 1)
          jq -e '[.workloads[].spec.name] | length == 12' benchmark-results/ratatui.json || (cat benchmark-results/ratatui.json && exit 1)
          jq -e 'all(.workloads[]; .spec.output_mode == "memory" and .spec.color_mode == "truecolor" and .spec.iterations >= 100 and .summary.Frames >= 100)' benchmark-results/limoni.json || (cat benchmark-results/limoni.json && exit 1)
          jq -e 'all(.workloads[]; .spec.output_mode == "memory" and .spec.color_mode == "truecolor" and .spec.iterations >= 100 and .summary.Frames >= 100)' benchmark-results/bubbletea.json || (cat benchmark-results/bubbletea.json && exit 1)
          jq -e 'all(.workloads[]; .spec.output_mode == "memory" and .spec.color_mode == "truecolor" and .spec.iterations >= 100 and .summary.Frames >= 100)' benchmark-results/ratatui.json || (cat benchmark-results/ratatui.json && exit 1)

      - name: Generate workload schema sample
        run: |
          cat > benchmark-results/README.txt <<'EOF'
          Benchmark artifacts use the workload schema from benchmarks.WorkloadSpec
          and the summary schema from benchmarks.Summary. Compare implementations
          only when dimensions, content, output sink, color mode, build and host
          are equivalent.
          EOF

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v4
        with:
          name: limoni-benchmarks
          path: benchmark-results/
